# ============================================================
# 小旦答 Demo 一键编排：一条命令拉起完整服务栈
#
#   基础栈（默认启动）：
#     docker compose up -d
#     → Milvus（etcd + MinIO）+ PostgreSQL + 小旦答 API（8080 端口）
#
#   可观测栈（按需启动）：
#     docker compose --profile observability up -d
#     → 追加 Langfuse 追踪面板（3000 端口，需在 .env 配置 keys）
#
# 说明：轻量任务模型通过 .env 的 LIGHT_LLM_BASE_URL 接入外部 OpenAI 兼容端点
# （云端 API 或本地推理服务），不可用时依次降级 DeepSeek → 本地兜底模型
# （FALLBACK_LLM_*），因此这些端点均不放入本编排。
# ============================================================
services:
  # ---------- Milvus 依赖：etcd（元数据） ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - ./volumes/etcd:/etcd-data
    command: etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd-data

  # ---------- Milvus 依赖：MinIO（对象存储） ----------
  minio:
    # 官方 minio/minio 已从 Docker Hub 下架（pull access denied），
    # 同 tag 镜像从 quay.io 获取，版本仍锁定以保证可复现
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data

  # ---------- Milvus 向量数据库 ----------
  milvus:
    image: milvusdb/milvus:v2.4.15
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530" # pymilvus 连接端口
      - "9091:9091" # 健康检查端口
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------- PostgreSQL：Checkpointer 短期记忆 + 长期记忆 + 高危上报 ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xiaodan
      # 密码与 api 服务读取同一变量，宿主机 / 容器永不漂移
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: xiaodan
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U xiaodan" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 小旦答 API 服务 ----------
  xiaodan-api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # 数据库与向量库连接（服务名即容器网络内的主机名）
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-xiaodan_kb}
      MILVUS_FAQ_COLLECTION: ${MILVUS_FAQ_COLLECTION:-xiaodan_faq}
      POSTGRES_HOST: postgres
      # 密码与 postgres 服务读取同一变量，双侧对齐
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # ===== LLM 端点（从 .env 透传，未配置时回落代码默认值）=====
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-30}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-false}
      LIGHT_LLM_BASE_URL: ${LIGHT_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LIGHT_LLM_API_KEY: ${LIGHT_LLM_API_KEY:-dummy}
      LIGHT_LLM_MODEL: ${LIGHT_LLM_MODEL:-qwen-plus}
      LIGHT_LLM_TIMEOUT: ${LIGHT_LLM_TIMEOUT:-15}
      LIGHT_LLM_THINKING: ${LIGHT_LLM_THINKING:-false}
      # 本地兜底模型：容器内访问宿主机需用 host.docker.internal
      FALLBACK_LLM_ENABLED: ${FALLBACK_LLM_ENABLED:-false}
      FALLBACK_LLM_BASE_URL: ${FALLBACK_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY:-ollama}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-}
      FALLBACK_LLM_TIMEOUT: ${FALLBACK_LLM_TIMEOUT:-60}
      # ===== 嵌入 / 重排模型 =====
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-BAAI/bge-m3}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      EMOTION_MODEL_PATH: ${EMOTION_MODEL_PATH:-models/emotion-xlmr}
      # ===== 检索 / 情绪 / 流程可调参数（默认值与 settings.py 一致）=====
      HYBRID_TOP_K: ${HYBRID_TOP_K:-20}
      RERANK_TOP_K: ${RERANK_TOP_K:-5}
      FAQ_MATCH_THRESHOLD: ${FAQ_MATCH_THRESHOLD:-0.85}
      HIGH_RISK_PROB_THRESHOLD: ${HIGH_RISK_PROB_THRESHOLD:-0.5}
      ESCALATION_ROUNDS: ${ESCALATION_ROUNDS:-3}
      MAX_RETRY: ${MAX_RETRY:-2}
      RECURSION_LIMIT: ${RECURSION_LIMIT:-25}
      HISTORY_MAX_ROUNDS: ${HISTORY_MAX_ROUNDS:-10}
      # ===== 关怀渠道信息（中度困扰后缀注入，真实联系方式由部署方在 .env 填入）=====
      CARE_CENTER_INFO_ZH: "${CARE_CENTER_INFO_ZH:-如需支持，可联系学校心理咨询中心（联系方式请向辅导员或校官网查询）。}"
      CARE_CENTER_INFO_EN: "${CARE_CENTER_INFO_EN:-If you need support, please contact the university counseling center (contact details available from your counselor or the official website).}"
      # ===== 高危上报邮箱 =====
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-465}
      ALERT_SENDER: ${ALERT_SENDER:-}
      ALERT_RECEIVER: ${ALERT_RECEIVER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      # ===== 评测裁判与 Langfuse 追踪 =====
      # 裁判走百炼的 OpenAI 兼容端点（密钥缺省时回退容器内的 QWEN 变量）
      JUDGE_API_KEY: ${JUDGE_API_KEY}
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen3-max-2026-01-23}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # 容器内访问 Langfuse 走服务名而非 localhost
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    volumes:
      # 知识库数据与模型权重通过挂载注入，镜像不含任何业务数据（去敏）
      - ./data:/app/data
      - ./models:/app/models
      - ./hf_cache:/app/hf_cache
    depends_on:
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ==================== 可观测栈（profile: observability） ====================

  # ---------- Langfuse 追踪面板（v2 单容器版，开箱即用） ----------
  langfuse:
    image: langfuse/langfuse:2
    profiles: [ "observability" ]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
      SALT: change-me-in-production
    depends_on:
      - langfuse-db

  # ---------- Langfuse 专用数据库（与业务库隔离） ----------
  langfuse-db:
    image: postgres:16
    profiles: [ "observability" ]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - ./volumes/langfuse-db:/var/lib/postgresql/data
