# ============================================================
# 小旦答：复旦校园智能问答与心理健康监测系统
# uv 项目模式配置：依赖声明 + 锁定（uv.lock 由 uv lock 生成）
# 安装：uv sync（自动创建 .venv 并按 lock 精确安装）
# ============================================================
[project]
name = "xiaodan"
version = "0.1.0"
description = "复旦校园智能问答与心理健康监测系统"
requires-python = ">=3.10"
dependencies = [
    # ===== 模块三：Agent 核心引擎 =====
    "langgraph>=0.2.0", # 状态图编排 + Checkpointer
    "langgraph-checkpoint-postgres>=1.0.0", # PostgresSaver 短期记忆
    "openai>=1.40.0", # DeepSeek / vLLM 均兼容 OpenAI 协议
    "python-dotenv>=1.0.0",
    # ===== 模块一：知识库引擎 =====
    # 必须限制上界：pymilvus 3.x 的 create_collection 要求 index_params 传 IndexParams
    # 对象（不再接受 dict），且客户端主版本须与 Milvus 服务端（v2.4.x）对齐
    "pymilvus>=2.4.0,<2.5", # Milvus 客户端（hybrid_search + RRF）
    # extras 必须覆盖代码实际处理的格式：基础包不含任何解析器，
    # 缺 pdf/docx/doc 时 partition_pdf()/partition_docx() 会直接 ImportError
    "unstructured[pdf,docx,doc]>=0.15.0", # PDF/HTML/DOCX/DOC 统一解析
    "flagembedding>=1.2.0", # BGE-M3（双路向量）+ BGE-Reranker-v2-M3
    "requests>=2.31.0", # 官网爬虫
    "beautifulsoup4>=4.12.0", # 官网爬虫 HTML 解析
    "playwright>=1.63.0", # 官网爬虫 JS 渲染（教务处等 SPA 站点）
    # 注意：首次使用需另执行 playwright install chromium 下载浏览器内核
    # ===== 模块二：情绪检测引擎 =====
    "torch>=2.1.0",
    "transformers>=4.40.0", # XLM-RoBERTa 微调与推理
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0", # 评测混淆矩阵 / 训练集切分
    # ===== 模块四：评估与可观测 =====
    "ragas>=0.4.3", # RAG 五指标评测
    "langchain-openai>=0.1.0", # RAGAS 裁判模型的 LangChain 封装
    "langchain-huggingface>=0.0.3", # RAGAS 本地 embedding
    # 必须限制上界：0.4.2 移除了 langchain_community.chat_models.vertexai 与
    # llms.VertexAI，而 ragas（至 0.4.3）仍在 llms/base.py 顶层 import 这两个符号，
    # 导致 import ragas 直接 ModuleNotFoundError。
    # 0.4.1 两者俱在，且其 langchain-core>=1.0.1,<2.0.0 与 langgraph 所要求的
    # langchain-core 1.x 兼容——因此锁在 0.4.1 是唯一不用回滚编排层的解。
    "langchain-community>=0.4.1,<0.4.2",
    "pandas>=2.0.0", # 评测明细导出
    "langfuse>=2.27.0", # 全链路追踪（开关式，未配置 keys 不生效）
    # ===== 模块五：服务化 =====
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.13.5",
    # 显式声明并限制上界：pymilvus 2.4.x 在导入时使用 pkg_resources
    # （from pkg_resources import get_distribution），而该模块在 setuptools 81 中
    # 已被移除，且 uv 创建的虚拟环境默认不含 setuptools，不声明会直接 ImportError
    "setuptools<81",
    "psycopg[binary]>=3.2", # PostgreSQL 驱动（记忆 / 上报 / Checkpointer 统一 psycopg3，见 infra/db.py）
]

# 开发依赖（uv sync 默认安装，Docker 镜像构建用 --no-dev 跳过）
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # 覆盖率：先只出报告、不设门槛（"67 项"是数量，不等于覆盖度）
    "pytest-cov>=6.0.0",
    # 代码检查：只做 check、不做 format（理由见下方 [tool.ruff]）
    "ruff>=0.16.0",
]

# ============================================================
# 代码检查（ruff）：只做 lint、不做 format
#
# 为什么不启用 formatter：本仓库的表格对齐与注释缩进是人工维护的，
# 一次性全仓重排会产生大量与语义无关的 diff，把真实改动埋掉。
# 因此这里只开"能发现错误"的规则，不开"改写排版"的规则。
# ============================================================
[tool.ruff]
# 目标版本决定 UP 规则敢改到什么程度（本项目 requires-python >= 3.10）
target-version = "py310"
# 约定的行宽。**刻意不启用 E501**：本仓库注释以中文为主，
# 字符数不是视觉宽度的可靠代理，逐行卡字符数只会逼出无意义的换行
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 + F 是 ruff 的默认集（导入规范 / 未定义名 / 语法错误 / pyflakes），
# 另加两项低争议、可自动修复的规则：
#   I  导入排序（人工维护容易漂移）
#   UP 按目标版本升级过时写法（如 Optional[X] → X | None）
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 该文件的导入顺序是**功能性的**，不是风格问题：必须先导入 config.settings
# 触发 load_dotenv()，再导入 huggingface_hub（它在导入时读取 HF_ENDPOINT 并固化）。
# 排序规则会把两者调换，等于让国内镜像配置静默失效——故豁免。
"knowledge_base/indexing/embeddings.py" = ["I001"]

# 包索引：阿里云镜像为主（国内网络访问 PyPI 慢且易超时）；
# 海外使用者可临时覆盖：UV_DEFAULT_INDEX=https://pypi.org/simple uv sync
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# PyTorch CUDA 构建源：默认 index（PyPI / 阿里云镜像）只提供 CPU 版 torch，
# 而本机是 RTX 4070 Laptop（compute capability 8.9 / Ada Lovelace），
# 需要 CUDA 构建才能让 BGE-Reranker 走 GPU
# （实测：CPU 构建下单次检索 25–33s，CUDA 构建 5.1s）。
# 版本与通道选择：保持 torch 版本号不变（2.14.0），只换构建变体，把回归面压到最小；
# 选 cu126 而非更新的 cu130，是因为前者与 FlagEmbedding / transformers /
# unstructured-inference 等生态组件的兼容面更广（本机驱动 616.92 远超其要求）。
#
# ⚠ 本机实测该源不可用：download.pytorch.org 在国内网络仅约 0.35 MB/s 且丢包，
#    拉 2.42 GiB 的 wheel 需两小时以上。实际走的是"手动下 wheel 再本地安装"：
#      uv pip install --no-index --no-deps --find-links <wheel目录> "torch==2.14.0+cu126"
#    （wheel 取自 mirrors.aliyun.com/pytorch-wheels/cu126/，实测快 3.5 倍；
#      该镜像只有扁平目录、无 PEP503 索引，uv 无法直接解析，故不能配成 index）
#    保留下方 index 声明是为了让网络条件好的环境能一条命令装好 CUDA 版。
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.uv]
# 本项目是脚本集合（python main.py / uvicorn deployment.api:app），
# 不构建为可安装的 Python 包，uv sync 只安装依赖本身
package = false
